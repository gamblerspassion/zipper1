name: Research real Overture address records in five missing NAD states
on:
  push:
    branches: [stance-fill-missing-states-20261107]
    paths: ['.github/workflows/stance-five-state-address-gapfill.yml']
  pull_request:
    branches: [internet4all-website]
    paths: ['.github/workflows/stance-five-state-address-gapfill.yml']
  workflow_dispatch:
jobs:
  missing-state-public-address-verification:
    strategy:
      fail-fast: false
      matrix:
        state: [HI, MI, MS, NV, NH]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Install public address extraction dependencies
        run: pip install -q overturemaps geopandas shapely pyogrio
      - name: Get real address records in state, first tile - verify source and schema
        shell: bash
        run: |
          set +e
          python3 -u tools/nad/overture_state_gapfill.py --state ${{ matrix.state }} --out state-gapfill --tile-size 1.5 --max-tiles 1
          CODE=$?
          echo "Extractor code=$CODE. A one-tile sample is always INCOMPLETE, never claim statewide coverage."
          cat state-gapfill/state=${{ matrix.state }}/STATE_AUDIT.json
          python3 - <<'PY'
          import json,os
          state=os.environ['STATE']
          d=json.load(open(f'state-gapfill/state={state}/STATE_AUDIT.json'))
          assert d['status']=='INCOMPLETE'
          assert d['unique_public_address_records'] >= 0
          print('STATE',state,'ACTUAL PUBLIC ADDRESSES',d['unique_public_address_records'])
          PY
        env:
          STATE: ${{ matrix.state }}
      - name: Upload genuine records and source audit even if no data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gapfill-${{ matrix.state }}-research-verified
          path: |
            state-gapfill/state=${{ matrix.state }}/STATE_AUDIT.json
            state-gapfill/state=${{ matrix.state }}/PROGRESS.json
            state-gapfill/state=${{ matrix.state }}/staging.sqlite
          if-no-files-found: warn
          retention-days: 7

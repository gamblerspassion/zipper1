name: Verify Honolulu government public address-point records
on:
  push:
    branches: [stance-fill-missing-states-20261107]
    paths: ['.github/workflows/honolulu-real-address-qa.yml']
  pull_request:
    branches: [internet4all-website]
    paths: ['.github/workflows/honolulu-real-address-qa.yml']
  workflow_dispatch:
jobs:
  honolulu:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v4
      - name: Query genuine Honolulu public address records with source audit
        run: python3 -u tools/nad/honolulu_official_address_extract.py honolulu-data
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: honolulu-government-real-addresses-with-audit
          path: honolulu-data/
          if-no-files-found: error
          retention-days: 14
